<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex" />
  <meta name="description" content="Page not found — take a creative detour back to STACKLY." />
  <title>404 — Page Not Found | STACKLY Creative Agency</title>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700;800&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet" />

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet" />
  <link rel="preload" as="image" href="images/c1.webp" fetchpriority="high" />
  <link href="css/style.css" rel="stylesheet" />
</head>
<body class="theme-stackly" data-page="404">

  <main>

    <!-- ===================== 404 HERO ===================== -->
    <section class="page-hero error-hero">
      <a href="index.html" class="error-logo" aria-label="Stackly home" data-hero-fade>
        <img src="images/logo-yellow.webp" alt="Stackly" class="brand-logo" />
      </a>
      <div class="hero-bg">
        <div class="hero-photo hero-photo--404"></div>
        <div class="hero-photo-scrim"></div>
        <div class="hero-grid-overlay"></div>
        <div class="hero-accents"></div>
      </div>
      <div class="container">
        <div class="error-inner" data-hero-fade>
          <p class="hero-eyebrow page-hero-eyebrow">Error 404</p>
          <h1 class="error-code" data-hero-line><span>4</span><span>0</span><span>4</span></h1>
          <p class="error-title" data-hero-fade>This page took a <em>creative detour</em></p>
          <p class="error-desc" data-hero-fade>
            The page you're looking for doesn't exist, has moved, or was never
            designed. Let's get you back on track.
          </p>
          <div class="error-ctas" data-hero-fade>
            <a href="index.html" class="btn-solid btn-solid--accent" data-back>Go Back <i class="bi bi-arrow-left"></i></a>
            <a href="index.html" class="btn-solid btn-solid--ghost">Back to Home <i class="bi bi-arrow-up-right"></i></a>
          </div>
          <p class="error-hint" data-hero-fade>Page not found · <a href="work.html">Browse our work</a> instead</p>
        </div>
      </div>
    </section>
  </main>
  <!-- ===================== SCRIPTS ===================== -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/ScrollTrigger.min.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
